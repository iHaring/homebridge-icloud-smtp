version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '06:00'
      timezone: Europe/Zurich
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: fix
      prefix-development: fix
      include: scope
    target-branch: main
    reviewers:
      - joff0
      - liamharing
